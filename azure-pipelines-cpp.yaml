name: Azure Backup Vault - CPP
trigger:
  batch: true
  branches:
    include:
      - master

resources:
  repositories:
  - repository: cppAzureDevOpsTemplates
    type: github
    name: hmcts/cpp-azure-devops-templates
    ref: 'main'
    endpoint: 'hmcts'

parameters:
  - name: tfversion
    default: 1.14.4
  - name: action
    values:
      - plan
      - apply
    default: plan
  - name: targetResources
    default: null

stages:
  - template: pipelines/terraform-plan-and-apply.yaml@cppAzureDevOpsTemplates
    parameters:
      planEnvironments:
        - platform: live
          environments:
            - prod
      tfversion: ${{ parameters.tfversion }}
      targetResources: ${{ parameters.targetResources }}
      dir: components/cpp
      tfvars: ../../environments/prod/cpp.tfvars
      terraformWorkspaceName: cpp-prod
      planStageCondition: in(variables['Build.Reason'], 'PullRequest', 'Manual')
      applyStageCondition: and(eq(variables['Build.Reason'], 'Manual'), eq('${{ parameters.action }}', 'apply'))
